<html>
<head>
  <title>Loan Calculator</title>
</head>
<body>
  <h3>Loan Calculator</h3>

  <form method="post" action="ComputeLoan">
    <p>Loan Amount:
      <input type="text" name="loanAmount" size="20">
    </p>

    <p>Annual Interest Rate:
      <input type="text" name="annualInterestRate" size="20">
    </p>

    <p>Number of Years:
      <input type="text" name="numberOfYears" size="20">
    </p>

    <p>
      <input type="submit" value="Compute Loan Payment">
      <input type="reset" value="Reset">
    </p>
  </form>
</body>
</html>
